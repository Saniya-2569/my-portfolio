<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retro Arcade Snake Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    h1 {
      font-size: 2rem;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    .score-board {
      display: flex;
      gap: 24px;
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .score-board span { color: #38bdf8; }
    canvas {
      background: #020617;
      border: 3px solid #334155;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .controls-hint {
      margin-top: 14px;
      color: #94a3b8;
      font-size: 0.9rem;
    }
    .btn-container {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      gap: 8px;
      margin-top: 16px;
    }
    .touch-btn {
      width: 56px;
      height: 56px;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .touch-btn:active { background: #0284c7; }
    .up { grid-column: 2; }
    .left { grid-column: 1; }
    .down { grid-column: 2; }
    .right { grid-column: 3; }
    .restart-btn {
      margin-top: 14px;
      background: #38bdf8;
      color: #020617;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    .restart-btn:hover { background: #0284c7; color: #fff; }
  </style>
</head>
<body>

  <h1>Retro Snake</h1>
  <div class="score-board">
    <div>Score: <span id="current-score">0</span></div>
    <div>Best: <span id="high-score">0</span></div>
  </div>

  <canvas id="gameCanvas" width="360" height="360"></canvas>

  <p class="controls-hint">Use Keyboard Arrow Keys or On-Screen Controls</p>

  <div class="btn-container">
    <button class="touch-btn up" onclick="setDirection('UP')">▲</button>
    <button class="touch-btn left" onclick="setDirection('LEFT')">◀</button>
    <button class="touch-btn down" onclick="setDirection('DOWN')">▼</button>
    <button class="touch-btn right" onclick="setDirection('RIGHT')">▶</button>
  </div>

  <button class="restart-btn" onclick="resetGame()">Restart Game</button>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('current-score');
    const highScoreEl = document.getElementById('high-score');

    const gridSize = 18;
    const tileCount = canvas.width / gridSize;

    let snake = [{ x: 10, y: 10 }];
    let food = { x: 5, y: 5 };
    let dx = 1;
    let dy = 0;
    let score = 0;
    let highScore = 0;
    let gameLoop;
    let isGameOver = false;

    function draw() {
      if (isGameOver) return;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        gameOver();
        return;
      }

      for (let segment of snake) {
        if (head.x === segment.x && head.y === segment.y) {
          gameOver();
          return;
        }
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.innerText = score;
        if (score > highScore) {
          highScore = score;
          highScoreEl.innerText = highScore;
        }
        placeFood();
      } else {
        snake.pop();
      }

      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2, gridSize / 2 - 2, 0, 2 * Math.PI);
      ctx.fill();

      snake.forEach((segment, index) => {
        ctx.fillStyle = index === 0 ? '#38bdf8' : '#0284c7';
        ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
      });
    }

    function placeFood() {
      food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
      for (let segment of snake) {
        if (segment.x === food.x && segment.y === food.y) {
          placeFood();
          break;
        }
      }
    }

    function setDirection(direction) {
      if (direction === 'UP' && dy === 0) { dx = 0; dy = -1; }
      else if (direction === 'DOWN' && dy === 0) { dx = 0; dy = 1; }
      else if (direction === 'LEFT' && dx === 0) { dx = -1; dy = 0; }
      else if (direction === 'RIGHT' && dx === 0) { dx = 1; dy = 0; }
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) setDirection('UP');
      else if (['ArrowDown', 'KeyS'].includes(e.code)) setDirection('DOWN');
      else if (['ArrowLeft', 'KeyA'].includes(e.code)) setDirection('LEFT');
      else if (['ArrowRight', 'KeyD'].includes(e.code)) setDirection('RIGHT');
    });

    function gameOver() {
      isGameOver = true;
      clearInterval(gameLoop);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#f87171';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '14px sans-serif';
      ctx.fillText('Press Restart to play again', canvas.width / 2, canvas.height / 2 + 20);
    }

    function resetGame() {
      clearInterval(gameLoop);
      snake = [{ x: 10, y: 10 }];
      dx = 1;
      dy = 0;
      score = 0;
      scoreEl.innerText = score;
      isGameOver = false;
      placeFood();
      gameLoop = setInterval(draw, 110);
    }

    resetGame();
  </script>
</body>
</html>
